name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  net10:
    name: net10.0 – build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Analytic reference tests
        run: dotnet test tests/Stykker.NanoCut.Tests -c Release --no-build --logger "console;verbosity=normal"
      - name: Oracle tests (Clipper2)
        run: dotnet test tests/Stykker.NanoCut.OracleTests -c Release --no-build --logger "console;verbosity=detailed"

  browser-wasm:
    name: browser-wasm – smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet build tests/Stykker.NanoCut.WasmSmoke -c Release
      - name: Run reference checks in the browser-wasm runtime
        run: node tests/Stykker.NanoCut.WasmSmoke/bin/Release/net10.0/wwwroot/main.mjs
