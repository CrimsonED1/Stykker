<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <title>Stykker-Suite: Zielbild mit StykkerNode und zentraler Kopplung</title>
  <desc>Stand 2026-10-13. Oben die Zugänge, in der Mitte der Knoten mit den Modulen als eigene Prozesse, unten die gemeinsamen Bibliotheken und Dateien. Farbe zeigt den Stand der Umsetzung.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="1010" fill="#ffffff"/>

  <text x="40" y="48" font-size="28" font-weight="700" fill="#1a1a1a">Stykker-Suite: Zielbild</text>
  <text x="40" y="76" font-size="15" fill="#555555">Stand 2026-10-13 · jede Oberfläche ist Web · jedes Modul läuft auch allein, ohne Knoten</text>

  <!-- ── Zugänge ── -->
  <g font-size="13" fill="#333333">
    <rect x="40" y="100" width="240" height="92" rx="10" fill="#f4f6f8" stroke="#78909c" stroke-width="1.5"/>
    <text x="56" y="126" font-size="16" font-weight="700" fill="#1a1a1a">Browser und Handy</text>
    <text x="56" y="148">Web-UI, Kopplung mit Code oder QR</text>
    <text x="56" y="168">von außen nur mit Schalter Home/VPN</text>

    <rect x="300" y="100" width="240" height="92" rx="10" fill="#f4f6f8" stroke="#78909c" stroke-width="1.5"/>
    <text x="316" y="126" font-size="16" font-weight="700" fill="#1a1a1a">Fenster</text>
    <text x="316" y="148">Photino-Hülle um dieselbe Web-UI</text>
    <text x="316" y="168">startet den Knoten, wenn keiner läuft</text>

    <rect x="560" y="100" width="240" height="92" rx="10" fill="#f4f6f8" stroke="#78909c" stroke-width="1.5"/>
    <text x="576" y="126" font-size="16" font-weight="700" fill="#1a1a1a">Modell-PCs</text>
    <text x="576" y="148">StykkerHost wählt sich ausgehend ein</text>
    <text x="576" y="168">Token statt Rolle, Protokoll bleibt</text>

    <rect x="820" y="100" width="240" height="92" rx="10" fill="#f4f6f8" stroke="#78909c" stroke-width="1.5"/>
    <text x="836" y="126" font-size="16" font-weight="700" fill="#1a1a1a">Terminal</text>
    <text x="836" y="148">stykker zeigt den LLM-Zustand</text>
    <text x="836" y="168">nur Anzeige, keine Befehle</text>

    <rect x="1080" y="100" width="280" height="92" rx="10" fill="#f4f6f8" stroke="#78909c" stroke-width="1.5"/>
    <text x="1096" y="126" font-size="16" font-weight="700" fill="#1a1a1a">Coding-Tools</text>
    <text x="1096" y="148">Claude Code, Qwen Code</text>
    <text x="1096" y="168">sprechen den Proxy :17500 direkt an</text>
  </g>

  <!-- ── StykkerNode ── -->
  <rect x="40" y="240" width="1320" height="410" rx="14" fill="#fafbfc" stroke="#78909c" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="60" y="270" font-size="18" font-weight="700" fill="#1a1a1a">StykkerNode</text>
  <text x="188" y="270" font-size="14" fill="#555555">der Knoten · eigener Prozess im Dauerbetrieb · startet die Module und beendet nur, was er selbst gestartet hat · Phase 4</text>

  <!-- Gateway -->
  <rect x="60" y="298" width="960" height="72" rx="8" fill="#ffffff" stroke="#78909c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="76" y="323" font-size="16" font-weight="700" fill="#1a1a1a">Gateway</text>
  <text x="160" y="323" font-size="13" fill="#333333">ein Port nach außen · prüft zuerst Netzschalter, Kopplung und Rolle</text>
  <text x="76" y="344" font-size="13" fill="#333333">leitet /hud, /sys, /cmd, /llm an die Module weiter, auch WebSockets (Blazor, Hosts) · Host und Origin bleiben unverändert</text>
  <text x="76" y="362" font-size="12" font-style="italic" fill="#8a5a00">Weiterleitung: YARP oder selbst geschrieben, noch offen</text>

  <!-- Zugänge → Gateway -->
  <line x1="160" y1="192" x2="160" y2="238" stroke="#37474f" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="420" y1="192" x2="420" y2="238" stroke="#37474f" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="680" y1="192" x2="680" y2="238" stroke="#37474f" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="694" y="222" font-size="12" font-style="italic" fill="#37474f">eine Tür: alles von außen geht durch das Gateway des Knotens</text>

  <!-- Coding-Tools → Proxy am LLM-Modul, am Gateway vorbei -->
  <line x1="1270" y1="192" x2="1270" y2="408" stroke="#37474f" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#ah)"/>
  <text x="1262" y="222" font-size="12" font-style="italic" fill="#37474f" text-anchor="end">kein Web-Pfad, nicht über das Gateway</text>

  <!-- Gateway → Module -->
  <line x1="212" y1="370" x2="212" y2="408" stroke="#37474f" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="537" y1="370" x2="537" y2="408" stroke="#37474f" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="862" y1="370" x2="862" y2="408" stroke="#37474f" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M1020,334 H1110 V408" fill="none" stroke="#37474f" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="876" y="393" font-size="12" font-style="italic" fill="#37474f">Module: nur 127.0.0.1</text>

  <!-- Module -->
  <g font-size="13" fill="#333333">
    <!-- HUD -->
    <rect x="60" y="410" width="305" height="220" rx="10" fill="#f1f3f4" stroke="#5f6b73" stroke-width="1.5"/>
    <text x="76" y="436" font-size="17" font-weight="700" fill="#1a1a1a">StykkerHUD</text>
    <text x="349" y="436" font-size="13" fill="#555555" text-anchor="end">:8079</text>
    <text x="76" y="458" font-weight="700" fill="#1a1a1a">die Zentrale</text>
    <text x="76" y="478">Kachel je Modul mit Status</text>
    <text x="76" y="496">Geräte und Rollen an einer Stelle</text>
    <text x="76" y="514">Knotenstatus, Modul einzeln neu starten</text>
    <text x="76" y="538">dazu der Monitor: CPU, RAM, GPU, Netz</text>
    <rect x="76" y="556" width="84" height="26" rx="5" fill="#ffffff" stroke="#9aa5ab"/><text x="118" y="574" text-anchor="middle">Web</text>
    <rect x="168" y="556" width="84" height="26" rx="5" fill="#ffffff" stroke="#9aa5ab"/><text x="210" y="574" text-anchor="middle">Server</text>
    <rect x="260" y="556" width="84" height="26" rx="5" fill="#ffffff" stroke="#9aa5ab"/><text x="302" y="574" text-anchor="middle">Core</text>
    <text x="76" y="612" font-size="12" font-style="italic" fill="#555555">läuft heute, nur lokal · Zentrale: Phase 5</text>

    <!-- SYS -->
    <rect x="385" y="410" width="305" height="220" rx="10" fill="#f1f3f4" stroke="#5f6b73" stroke-width="1.5"/>
    <text x="401" y="436" font-size="17" font-weight="700" fill="#1a1a1a">StykkerSYS</text>
    <text x="674" y="436" font-size="13" fill="#555555" text-anchor="end">:8077</text>
    <text x="401" y="458" font-weight="700" fill="#1a1a1a">Prozessliste</text>
    <text x="401" y="478">CPU, Speicher und GPU je Prozess</text>
    <text x="401" y="496">beenden, Priorität, Dateiort öffnen</text>
    <text x="401" y="520">Aktionen nur mit Rolle admin</text>
    <text x="401" y="538">ein neu gekoppeltes Gerät sieht nur zu</text>
    <rect x="401" y="556" width="84" height="26" rx="5" fill="#ffffff" stroke="#9aa5ab"/><text x="443" y="574" text-anchor="middle">Web</text>
    <rect x="493" y="556" width="84" height="26" rx="5" fill="#ffffff" stroke="#9aa5ab"/><text x="535" y="574" text-anchor="middle">Server</text>
    <rect x="585" y="556" width="84" height="26" rx="5" fill="#ffffff" stroke="#9aa5ab"/><text x="627" y="574" text-anchor="middle">Core</text>
    <text x="401" y="612" font-size="12" font-style="italic" fill="#555555">läuft heute, nur lokal · Rollen: Phase 6</text>

    <!-- CMD -->
    <rect x="710" y="410" width="305" height="220" rx="10" fill="#ffffff" stroke="#78909c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="726" y="436" font-size="17" font-weight="700" fill="#1a1a1a">StykkerCMD</text>
    <text x="999" y="436" font-size="13" fill="#555555" text-anchor="end">Port offen</text>
    <text x="726" y="458" font-weight="700" fill="#1a1a1a">Dateimanager, zwei Panels</text>
    <text x="726" y="478">bekommt Web-UI und Server-Version</text>
    <text x="726" y="496">Core und Platform bleiben, Avalonia entfällt</text>
    <text x="726" y="520">nur Rolle admin, nur gekoppelte Geräte,</text>
    <text x="726" y="538">nur freigegebene Wurzelordner</text>
    <rect x="726" y="556" width="84" height="26" rx="5" fill="#ffffff" stroke="#9aa5ab" stroke-dasharray="4 3"/><text x="768" y="574" text-anchor="middle">Web</text>
    <rect x="818" y="556" width="84" height="26" rx="5" fill="#ffffff" stroke="#9aa5ab" stroke-dasharray="4 3"/><text x="860" y="574" text-anchor="middle">Server</text>
    <rect x="910" y="556" width="84" height="26" rx="5" fill="#f1f3f4" stroke="#5f6b73"/><text x="952" y="574" text-anchor="middle">Core</text>
    <text x="726" y="612" font-size="12" font-style="italic" fill="#555555">heute ein Avalonia-Fenster · Umbau: Phase 7</text>

    <!-- LLM -->
    <rect x="1035" y="410" width="305" height="220" rx="10" fill="#e3f0ff" stroke="#1565c0" stroke-width="2"/>
    <text x="1051" y="436" font-size="17" font-weight="700" fill="#0d3c75">StykkerLLM</text>
    <text x="1324" y="436" font-size="13" fill="#0d3c75" text-anchor="end">:8078 · Proxy :17500</text>
    <text x="1051" y="458" font-weight="700" fill="#1a1a1a">das erste Modul</text>
    <text x="1051" y="478">lokale LLM-Server messen und steuern</text>
    <text x="1051" y="496">Proxy: eine URL für alle Modelle</text>
    <text x="1051" y="520">Kopplung zieht in die gemeinsame Ablage,</text>
    <text x="1051" y="538">alte Geräte und Hosts bleiben angemeldet</text>
    <rect x="1051" y="556" width="84" height="26" rx="5" fill="#ffffff" stroke="#1565c0" stroke-dasharray="4 3"/><text x="1093" y="574" text-anchor="middle">Web</text>
    <rect x="1143" y="556" width="84" height="26" rx="5" fill="#ffffff" stroke="#1565c0"/><text x="1185" y="574" text-anchor="middle">Server</text>
    <rect x="1235" y="556" width="84" height="26" rx="5" fill="#ffffff" stroke="#1565c0"/><text x="1277" y="574" text-anchor="middle">Core</text>
    <text x="1051" y="612" font-size="12" font-style="italic" fill="#0d3c75">nächster Schritt: Web abtrennen, Kopplung umstellen</text>
  </g>

  <!-- Module → Kopplung -->
  <path d="M212,630 V668 M537,630 V668 M862,630 V668 M1187,630 V668" fill="none" stroke="#37474f" stroke-width="1.4"/>
  <path d="M212,668 H1187" fill="none" stroke="#37474f" stroke-width="1.4"/>
  <line x1="250" y1="668" x2="250" y2="706" stroke="#37474f" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="264" y="692" font-size="12" font-style="italic" fill="#37474f">jedes Modul und der Knoten benutzen dieselbe Bibliothek und dieselbe Datei</text>

  <!-- ── Gemeinsames ── -->
  <g font-size="13" fill="#333333">
    <rect x="40" y="708" width="420" height="150" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
    <text x="56" y="734" font-size="16" font-weight="700" fill="#1b5e20">Stykker.Pairing</text>
    <text x="444" y="734" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="end">fertig · 42 Tests</text>
    <text x="56" y="758">Zugangscode: sechs Ziffern, zehn Minuten, einmal gültig</text>
    <text x="56" y="776">Anmeldung in beide Richtungen, Freigabe auch aus der Zentrale</text>
    <text x="56" y="794">Geräte mit einer Rolle je Modul, Hosts mit Token</text>
    <text x="56" y="812">mehrere Prozesse schreiben zugleich, ohne sich zu überschreiben</text>
    <text x="56" y="836" font-size="12" font-style="italic" fill="#1b5e20">übernimmt access.dat und hosts.dat von StykkerLLM, einmalig</text>

    <rect x="480" y="708" width="270" height="150" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
    <text x="496" y="734" font-size="16" font-weight="700" fill="#1b5e20">pairing.dat</text>
    <text x="496" y="758">%APPDATA%\Stykker\</text>
    <text x="496" y="776">an den Windows-Benutzer gebunden</text>
    <text x="496" y="794">nur Hashes, nie ein Token</text>
    <text x="496" y="812">Code, Geräte, Rollen, Hosts</text>
    <text x="496" y="836" font-size="12" font-style="italic" fill="#1b5e20">eine Ablage für alle Module</text>

    <rect x="770" y="708" width="270" height="150" rx="10" fill="#ffffff" stroke="#78909c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="786" y="734" font-size="16" font-weight="700" fill="#1a1a1a">stykker.json</text>
    <text x="786" y="758">%APPDATA%\Stykker\</text>
    <text x="786" y="776">lesbar, ohne Geheimnisse</text>
    <text x="786" y="794">Knoten: Name, Port, Netzschalter</text>
    <text x="786" y="812">Module: Programm, Port, Datenordner</text>
    <text x="786" y="836" font-size="12" font-style="italic" fill="#555555">ohne Datei läuft alles wie heute · Phase 2</text>

    <rect x="1060" y="708" width="300" height="150" rx="10" fill="#f1f3f4" stroke="#5f6b73" stroke-width="1.5"/>
    <text x="1076" y="734" font-size="16" font-weight="700" fill="#1a1a1a">Stykker.Shared · Design-System</text>
    <text x="1076" y="758">GPU-Zähler, Tray-Symbol, Messschleife</text>
    <text x="1076" y="776">ein Server je Port, lokale Anfragen</text>
    <text x="1076" y="794">Themen dark und titan für alle Oberflächen</text>
    <text x="1076" y="836" font-size="12" font-style="italic" fill="#555555">heute von HUD und SYS benutzt</text>
  </g>

  <!-- ── Legende ── -->
  <g font-size="13" fill="#333333">
    <text x="40" y="900" font-size="14" font-weight="700" fill="#1a1a1a">Stand</text>
    <rect x="40" y="916" width="34" height="20" rx="4" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
    <text x="84" y="931">fertig und getestet</text>
    <rect x="250" y="916" width="34" height="20" rx="4" fill="#e3f0ff" stroke="#1565c0" stroke-width="2"/>
    <text x="294" y="931">nächster Schritt</text>
    <rect x="440" y="916" width="34" height="20" rx="4" fill="#f1f3f4" stroke="#5f6b73" stroke-width="1.5"/>
    <text x="484" y="931">gibt es heute, wird noch angebunden</text>
    <rect x="750" y="916" width="34" height="20" rx="4" fill="#ffffff" stroke="#78909c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="794" y="931">geplant, noch nicht gebaut</text>
    <text x="40" y="970" font-size="13" fill="#555555">Reihenfolge: Kopplung (fertig) → stykker.json → LLM als Modul → StykkerNode → HUD als Zentrale → SYS mit Rollen → CMD im Web → Dienst (optional).</text>
    <text x="40" y="990" font-size="13" fill="#555555">Die Phasen 5 bis 7 hängen nicht voneinander ab, sobald der Knoten steht. Einzelheiten: plan-stykkernode.md.</text>
  </g>
</svg>
